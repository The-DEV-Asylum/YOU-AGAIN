;
; AntiStalker - PlatformIO config
; Target: ESP32-S3-WROOM-1-N16R8 (16 MB flash, 8 MB OPI PSRAM)
;
;   pio run -e esp32s3_n16r8                  build
;   pio run -e esp32s3_n16r8 --target upload  flash
;   pio test -e native                        unit tests on your laptop
;
; Everything is version-pinned on purpose. "Works on my machine" is a
; feature only if your machine is reproducible.
;

[env:esp32s3_n16r8]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags =
    -DBOARD_HAS_PSRAM
    ; Serial goes to UART0 (the board's WCH USB-UART bridge). Using the native
    ; USB port instead? Set this to 1, or enjoy a very quiet serial monitor.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    ; BLE 5 extended adverts + Coded PHY (long range) scanning.
    -DCONFIG_BT_NIMBLE_EXT_ADV=1
    -DCONFIG_BT_NIMBLE_MAX_EXT_ADV_DATA_LEN=255
    ; Vendored tiny-AES-c (public domain) needs ECB for the Bluetooth ah().
    -DECB=1
    ; Optional battery monitoring: GPIO of a battery voltage divider, and the
    ; divider ratio (battery volts -> volts at the pin). Keep the pin below
    ; ~3.1 V at full charge. Example for a 1S Li-ion with a 100k/100k divider:
    ; -DANTISTALKER_BATTERY_PIN=4
    ; -DANTISTALKER_BATTERY_DIVIDER=2.0
lib_deps =
    h2zero/NimBLE-Arduino@2.5.2
    bblanchon/ArduinoJson@7.4.3
monitor_speed = 115200

; Host build for the Unity tests. Only lib/AntiStalker is compiled here
; (test_build_src = false), which is exactly why that library must never
; include Arduino.h.
[env:native]
platform = native
test_framework = unity
test_build_src = false
build_flags =
    -std=c++11
    -Wall
    -Wextra
    -Wpedantic
    ; Vendored tiny-AES-c (public domain) needs ECB for the Bluetooth ah().
    -DECB=1
